<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICECREAM SHOP</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <nav>
        <div><img src="./images/logo 1.png" alt="Brand Logo" /></div>
        <ul class="li-container">
          <li class="brown"><a href="#">Home</a></li>
          <li><a href="#">About us</a></li>
          <li><a href="#">How it's made?</a></li>
          <li><a href="#">Our products</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <div>
          <button class="buy-btn">Buy now <span>></span></button>
        </div>
      </nav>

      <div class="header-hero-section">
        <div class="left-section">
          <div class="text-section">
            <h1>ICE CREAM MADE WITH <span>PASSION</span></h1>
          </div>

          <div class="left-section-btns">
            <button class="product">Products</button>
            <button class="how-it-made">How it's made?</button>
          </div>

          <div class="left-section-content">
            <div class="jug">
              <img src="./images/header_pic1.png" alt="Jug_img" />
            </div>

            <div class="lorem-text">
              Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
              eiusmod tempor incididunt ut labore et.
              <img
                src="./images/right_arraow.png"
                alt="Arrow img"
              />
            </div>
          </div>
        </div>

        <div class="circle"></div>
        <div class="icecream-image">
          <img src="./images/header_hero.png" alt="Hero img" />
        </div>

        <div class="right-section">
          <div class="stats">
            <div class="stat">
              <div class="number-box">
                <span class="white-circle"></span>
                <h2>16</h2>
              </div>
              <p>cafes</p>
            </div>

            <div class="stat">
              <div class="number-box">
                <span class="white-circle"></span>
                <h2>23</h2>
              </div>
              <p>food trucks</p>
            </div>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
